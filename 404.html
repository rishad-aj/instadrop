<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page not found · Instadrop</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; text-align: center;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #fafafa; color: #111; padding: 24px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #161616; color: #eee; }
    }
    img { display: block; margin: 0 auto; }
    .icon { width: 56px; height: 56px; margin-bottom: 18px; }
    .wordmark { height: 30px; width: auto; margin-bottom: 34px; }
    @media (prefers-color-scheme: dark) { .wordmark { filter: invert(1); } }
    h1 { font-size: 44px; font-weight: 800; margin-bottom: 10px; }
    p { font-size: 15px; line-height: 1.6; opacity: .75; margin-bottom: 28px; }
    a.btn {
      display: inline-block; padding: 12px 28px; border-radius: 999px;
      background: #2563eb; color: #fff; text-decoration: none; font-weight: 600; font-size: 15px;
      transition: background-color .15s;
    }
    a.btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div>
    <img class="icon" src="logo.png" alt="">
    <img class="wordmark" src="brand.png" alt="Instadrop">
    <h1>404</h1>
    <p>That page doesn't exist.<br>But your downloads do — let's get you back.</p>
    <a class="btn" href="/">Back to Instadrop</a>
  </div>
</body>
</html>
