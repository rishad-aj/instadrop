<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instadrop &mdash; Quick Download Widget</title>
  <meta name="description" content="Quickly paste an Instagram link or @username and download reels, posts, profile pictures and audio in one tap.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2563eb">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161616">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Instadrop">
  <meta name="apple-mobile-web-app-title" content="Instadrop">
  <meta property="og:site_name" content="Instadrop">
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="256x256" href="images/logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-light.png">
  <link rel="apple-touch-icon" sizes="180x180" media="(prefers-color-scheme: dark)" href="icons/apple-touch-icon-dark.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/rippleui@1.12.1/dist/css/base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/rippleui@1.12.1/dist/css/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .widget-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      z-index: 1;
    }
    .widget-card {
      width: 100%;
      max-width: 560px;
      background-color: rgb(var(--backgroundPrimary));
    }
    html[data-theme="dark"] .widget-card {
      background-color: rgb(var(--backgroundSecondary));
    }
    .widget-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgb(var(--gray-6));
    }
    .widget-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .widget-card .card-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .widget-card h1 {
      margin: 0;
    }
    .widget-card #goBtn {
      margin-top: 2px;
    }
  </style>
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search);
        var t = q.get("theme");
        var saved = null;
        try { saved = localStorage.getItem("instadrop_theme"); } catch (e) {}
        var choice = t || saved || "light";
        var dark = choice === "dark" || (choice === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M4 19h16"/></symbol>
  <symbol id="i-paste" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-display" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
</svg>

<div class="top-wave" aria-hidden="true">
  <svg viewBox="0 0 1440 750" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M-72 750V-85H1456V750C881.128 570.461 197.803 675.192 -72 750Z"></path>
  </svg>
</div>

<main class="widget-shell">
  <div class="card download-card widget-card" role="search" aria-label="Instadrop quick download">
    <div class="card-body">
      <div class="widget-head">
        <a class="app-brand" href="./">
          <img class="brand-logo" src="images/logo.png" alt="Instadrop logo" width="32" height="32">
          <img class="brand-wordmark" src="images/brand.png" alt="Instadrop" width="114" height="24">
        </a>
        <div class="widget-actions">
          <div class="theme-dd" id="themeDropdown">
            <label class="dd-btn" tabindex="0" aria-label="Toggle theme" title="Theme">
              <svg class="ic i-moon"><use href="#i-moon"/></svg>
              <svg class="ic i-sun"><use href="#i-sun"/></svg>
            </label>
            <div class="dd-menu" role="menu">
              <span class="dd-item" data-theme-choice="light" role="menuitem" tabindex="-1"><svg class="ic"><use href="#i-sun"/></svg> Light</span>
              <span class="dd-item" data-theme-choice="dark" role="menuitem" tabindex="-1"><svg class="ic"><use href="#i-moon"/></svg> Dark</span>
              <span class="dd-item" data-theme-choice="system" role="menuitem" tabindex="-1"><svg class="ic"><use href="#i-display"/></svg> System</span>
            </div>
          </div>
          <a class="btn btn-outline btn-sm btn-rounded" id="openAppBtn" href="./#downloader">Open full app</a>
        </div>
      </div>

      <h1>Paste your link below</h1>
      <div class="searchbox">
        <div class="input-wrap" id="inputWrap">
          <input id="linkInput" class="input input-lg" type="text" inputmode="url" spellcheck="false" autocomplete="off" aria-label="Paste an Instagram link or username">
          <span class="ph-scroll" aria-hidden="true">
            <span class="ph-marquee"><span class="ph-copy">https://www.instagram.com/example/... or @username</span><span class="ph-copy">https://www.instagram.com/example/... or @username</span></span>
          </span>
        </div>
        <button id="pasteBtn" class="btn btn-outline btn-lg btn-rounded" type="button" title="Paste from clipboard">
          <svg class="ic" style="width:18px;height:18px;"><use href="#i-paste"/></svg> Paste
        </button>
      </div>
      <button id="goBtn" class="btn btn-primary btn-lg btn-rounded btn-block" type="button">
        <svg class="ic" style="width:18px;height:18px;"><use href="#i-download"/></svg> Download
      </button>
      <p class="hint" id="statusText">Works with reels, posts, carousels, profile pictures and highlights &mdash; 100% free &amp; ad-free.</p>
      <div id="errorEl" class="alert alert-error hidden"></div>
    </div>
  </div>
</main>

<script>
  (function () {
    "use strict";

    var input = document.getElementById("linkInput");
    var inputWrap = document.getElementById("inputWrap");
    var pasteBtn = document.getElementById("pasteBtn");
    var goBtn = document.getElementById("goBtn");
    var status = document.getElementById("statusText");
    var errorEl = document.getElementById("errorEl");
    var params = new URLSearchParams(location.search);
    var action = params.get("action");

    function applyTheme(dark) {
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    }
    function themeChoice() {
      var c = params.get("theme");
      if (!c) {
        try { c = localStorage.getItem("instadrop_theme"); } catch (e) {}
      }
      return (c === "light" || c === "dark" || c === "system") ? c : "light";
    }
    function applyChoice(c) {
      var dark = c === "system"
        ? !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)
        : c === "dark";
      applyTheme(dark);
    }
    applyChoice(themeChoice());

    var items = document.querySelectorAll(".theme-dd .dd-item");
    function syncTheme() {
      var c = themeChoice();
      for (var i = 0; i < items.length; i++) {
        items[i].classList.toggle("dd-active", items[i].dataset.themeChoice === c);
      }
    }
    for (var i = 0; i < items.length; i++) {
      items[i].addEventListener("click", function () {
        var c = this.dataset.themeChoice;
        try { localStorage.setItem("instadrop_theme", c); } catch (e) {}
        applyChoice(c);
        syncTheme();
        var btn = document.querySelector(".theme-dd .dd-btn");
        if (btn) btn.blur();
      });
    }
    syncTheme();

    window.addEventListener("storage", function (e) {
      if (e.key === "instadrop_theme") {
        applyChoice(e.newValue || "light");
        syncTheme();
      }
    });
    var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
    if (mq && mq.addEventListener) {
      mq.addEventListener("change", function (e) {
        if (themeChoice() === "system") applyTheme(e.matches);
      });
    }

    function syncPh() {
      if (inputWrap && input) inputWrap.classList.toggle("has-val", input.value.length > 0);
    }
    input.addEventListener("input", function () {
      syncPh();
      errorEl.classList.add("hidden");
    });
    syncPh();

    var phScroll = document.querySelector(".ph-scroll");
    var phMarquee = document.querySelector(".ph-marquee");
    if (phScroll && phMarquee) {
      var syncMarq = function () { phMarquee.classList.toggle("marq-on", phMarquee.scrollWidth > phScroll.clientWidth); };
      window.addEventListener("resize", syncMarq);
      syncMarq();
    }

    function looksLikeInsta(s) {
      s = String(s || "").trim();
      if (!s) return false;
      return /instagram\.com\//i.test(s) || /^@?[A-Za-z0-9._]{1,30}$/.test(s);
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.remove("hidden");
    }

    function go() {
      var v = input.value.trim();
      if (!v) {
        input.focus();
        showError("Paste an Instagram link or @username first.");
        return;
      }
      location.href = "./?url=" + encodeURIComponent(v) + "#downloader";
    }

    async function doPaste(auto) {
      try {
        var t = await navigator.clipboard.readText();
        if (t && t.trim()) {
          input.value = t.trim();
          syncPh();
          errorEl.classList.add("hidden");
          if (auto || looksLikeInsta(t)) {
            status.textContent = "Pasted from clipboard — opening download…";
            setTimeout(go, 350);
          }
          return;
        }
        showError("Clipboard is empty — copy an Instagram link first, then press Paste.");
        input.focus();
      } catch (e) {
        showError("Couldn't read clipboard automatically — press Ctrl+V or long-press inside the box.");
        input.focus();
      }
    }

    pasteBtn.addEventListener("click", function () { doPaste(true); });
    goBtn.addEventListener("click", go);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });

    if (action === "paste") {
      setTimeout(function () { doPaste(true); }, 300);
    }
  })();
</script>
</body>
</html>
